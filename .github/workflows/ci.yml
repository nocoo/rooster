# rooster CI — Tier A (no L3, no probe)

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  quality:
    name: "Quality (G1 + L1 + G2)"
    uses: nocoo/base-ci/.github/workflows/quality.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      runtime-version: "1.3.14"
      install-policy: "trusted"
      coverage-path: "coverage"
      lint-command: "bun run lint"
      typecheck-command: "bun run typecheck"
      test-command: "bun run test:coverage"
      osv-config: "osv-scanner.toml"
      security-command: "bun run gate:security"
    secrets: inherit

  coverage-gates:
    name: "Coverage Gates (D1 + L2 static)"
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      runtime-version: "1.3.14"
      install-policy: "blocked"
      timeout-minutes: 5
      command: |
        bun run gate:isolation
        bun run gate:routes

  l2-e2e:
    name: "L2 E2E (real listen)"
    uses: nocoo/base-ci/.github/workflows/test-job.yml@ab52d72877d386c9a8fd224e9ac868e88be90539
    with:
      runtime-version: "1.3.14"
      install-policy: "trusted"
      timeout-minutes: 15
      command: "bun run test:e2e"
